name: Build → TestFlight
on:
  workflow_dispatch:
    inputs:
      submit: { description: 'Envoyer sur TestFlight', type: boolean, default: true }
  push:
    tags: ['v*']

concurrency: { group: ios-build, cancel-in-progress: false }

jobs:
  # Aucun build ne part sur du rouge : la règle du projet est qu'on ne pose un
  # tag que sur des tests verts, et la CI la fait respecter.
  checks:
    uses: ./.github/workflows/checks.yml
  native-tests:
    uses: ./.github/workflows/native-tests.yml

  build:
    needs: [checks, native-tests]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install -g eas-cli@latest
      # Sans le Team ID, eas-cli demande à l'écran de quelle équipe Apple il
      # s'agit et s'arrête net en mode non interactif : c'est ce qui bloque la
      # création du profil de la cible d'extension.
      - name: Compiler l'IPA sur le runner
        env:
          EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}'
          EXPO_APPLE_TEAM_ID: M9GRJSY2QN
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas build --platform ios --profile production \
            --local --non-interactive \
            --output "${{ runner.temp }}/app.ipa"
      - name: Envoyer sur TestFlight
        # Sur un push de tag, inputs est vide et '' == false pour GitHub :
        # il faut autoriser explicitement le cas tag.
        if: ${{ github.event_name == 'push' || inputs.submit }}
        env:
          EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}'
          EXPO_APPLE_TEAM_ID: M9GRJSY2QN
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          eas submit --platform ios --profile production \
            --path "${{ runner.temp }}/app.ipa" --non-interactive
      # Pas d'artifact IPA : sur un repo public il serait téléchargeable par tous.
      - if: always()
        run: rm -f "${{ runner.temp }}/app.ipa"
